repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen v6.0.0
  hooks:
  - id: trailing-whitespace
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: f368fb366ff7f2f808dd324b83a6d32267799e19  # frozen v0.17.2
  hooks:
  - id: ruff-check
    args: [--fix, --exit-non-zero-on-fix]
  - id: ruff-format
- repo: https://github.com/jsh9/pydoclint
  rev: 871751487edc82248bd8ffdaef1aa0f09968102f  # frozen 0.11.1
  hooks:
  - id: pydoclint
- repo: https://github.com/crate-ci/typos
  rev: 7f9d0819ca1c008ade73f4b41fa9d258d48f605b  # frozen v1.51.1
  hooks:
    - id: typos
- repo: https://github.com/pocc/pre-commit-hooks
  rev: 5cf2d294128684d7fad69cd76a146a268761fbfc  # frozen v1.4.0
  hooks:
  - id: clang-format
    args: [-i, --style=file]
- repo: https://github.com/astral-sh/uv-pre-commit
  # uv version.
  rev: eeca16c54e09b4d9a848259e46bae14737944348  # frozen 0.13.5
  hooks:
    # Update the uv lockfile
    - id: uv-lock

