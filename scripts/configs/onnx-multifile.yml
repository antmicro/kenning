model_wrapper:
  type: kenning.modelwrappers.classification.pytorch_pet_dataset.PyTorchPetDatasetMobileNetV2
  parameters:
    model_path: kenning:///models/classification/pytorch_pet_dataset_mobilenetv2_full_model.pth
    model_name: torch-native
dataset:
  type: kenning.datasets.pet_dataset.PetDataset
  parameters:
    dataset_root: "./build/PetDataset"
    image_memory_layout: NCHW
optimizers:
  - type: kenning.optimizers.model_inserter.ModelInserter
    parameters:
      model_framework: onnx
      input_model_path: kenning:///models/classification/pytorch_pet_dataset_mobilenetv2_onnx.tar.gz
      compiled_model_path: "./build/model.tar.gz"
runtime:
  type: kenning.runtimes.onnx.ONNXRuntime
  parameters:
    save_model_path: "./build/model.tar.gz"
    execution_providers:
      - CPUExecutionProvider
