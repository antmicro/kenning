platform:
  type: ZephyrPlatform
  parameters:
    name: khadas_edgev/rk3399
    simulated: false
    uart_port: /dev/ttyUSB1

model_wrapper:
  type: PyTorchMagicWandModelWrapper
  parameters:
    model_path: ./output/magic_wand.pth
    model_name: torch-native
    learning_rate: 0.01
    num_epochs: 30
    logdir: build/logs
    batch_size: 32
    export_dict: False

dataset:
  type: MagicWandDataset
  parameters:
    dataset_root: ./output/MagicWandDataset

optimizers:
  - type: ExecuTorchOptimizer
    parameters:
      compiled_model_path: ./output/optimized_magicwand.pte
      quantize: false

runtime:
  type: ExecuTorchRuntime
  parameters:
    save_model_path: ./output/optimized_magicwand.pte
