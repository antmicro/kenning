platform:
  type: CUDAPlatform
  parameters:
    name: jetson_thor_devkit
model_wrapper:
  type: kenning.modelwrappers.instance_segmentation.yolact.YOLACT
  parameters:
    model_path: kenning:///models/instance_segmentation/yolact.onnx
dataset:
  type: kenning.datasets.open_images_dataset.OpenImagesDatasetV6
  parameters:
    dataset_root: ./build/OpenImagesDatasetV6
    inference_batch_size: 1
    task: instance_segmentation
    image_width: 550
    image_height: 550
optimizers:
- type: kenning.optimizers.onnx.ONNXCompiler
  parameters:
      compiled_model_path: ./build/compiled_model.onnx
runtime:
  type: kenning.runtimes.onnx.ONNXRuntime
  parameters:
    save_model_path: ./build/compiled_model.onnx
    execution_providers:
    - CUDAExecutionProvider
    - CPUExecutionProvider
report:
  type: MarkdownReport
  parameters:
    measurements: ./build/yolact-onnx-gpu-detection-cfg.json
    report_path: ./build/yolact-onnx-gpu-detection/report.md
    report_name: "Sample ONNX model on GPU inference report"
    report_types:
      - performance
      - classification
    to_html: true
