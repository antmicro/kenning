model_wrapper:
  type: kenning.modelwrappers.object_detection.yolo_transfer_learning.YOLOV4TL
  parameters:
    model_path: kenning:///models/object_detection/yolov4.pth
    save_model_path: ./build/yolov4_native.pth
    model_name: yolov4
    native: true
    # classes: ./build/oid_classes
    batch_size: 1
    # learning_rate: 0.001
    # head_num_epochs: 2
    # full_num_epochs: 10
    # logdir: build/logs
dataset:
  # type: kenning.datasets.open_images_dataset.OpenImagesDatasetV6
  # parameters:
  #   dataset_root: ./build/OpenImagesDatasetV6
  #   task: object_detection
  #   classes: ./build/oid_classes
  #   image_width: 608
  #   image_height: 608
  type: kenning.datasets.coco_dataset.COCODataset2017
  parameters:
    dataset_root: ./build/COCODataset2017
    dataset_type: val2017
    image_width: 608
    image_height: 608
runtime:
  type: kenning.runtimes.pytorch.PyTorchRuntime
  parameters:
    save_model_path: ./build/yolov4_native.pth
report:
  type: MarkdownReport
  parameters:
    measurements: ./build/yolov4_pytorch_native.json
    report_path: ./build/yolov4_pytorch