model_wrapper:
  type: kenning.modelwrappers.object_detection.yolo_transfer_learning.YOLOV4TL
  parameters:
    model_path: kenning:///models/object_detection/yolov4.pth
    model_name: yolov4
    batch_size: 1
dataset:
  type: kenning.datasets.coco_dataset.COCODataset2017
  parameters:
    dataset_root: ./build/COCODataset2017
    dataset_type: val2017
    image_width: 608
    image_height: 608
optimizers:
  - type: kenning.optimizers.tflite.TFLiteCompiler
    parameters:
      target: default
      compiled_model_path: ./build/fp32.tflite
      inference_input_type: float32
      inference_output_type: float32
runtime:
  type: kenning.runtimes.tflite.TFLiteRuntime
  parameters:
    save_model_path: ./build/fp32.tflite
